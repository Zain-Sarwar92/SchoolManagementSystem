<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Generator — Font options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;700&family=Manrope:wght@500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f7fa;
        --ink: #0f172a;
        --muted: #64748b;
        --card: #fff;
        --accent: #0c4a6e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
      }
      .lead {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
      }
      .card {
        background: var(--card);
        border-radius: 1rem;
        padding: 1.15rem 1.2rem 1.25rem;
        box-shadow: 0 10px 28px rgba(15, 39, 68, 0.08);
        border: 1px solid #e2e8f0;
      }
      .card.current {
        border-color: #0e7490;
        box-shadow: 0 12px 32px rgba(12, 74, 110, 0.16);
      }
      .tag {
        display: inline-block;
        margin-bottom: 0.55rem;
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        background: #ecfeff;
        color: var(--accent);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .pair {
        margin: 0 0 0.35rem;
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 600;
      }
      .display {
        margin: 0.2rem 0 0.35rem;
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .ui {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 500;
        color: #334155;
        line-height: 1.45;
      }
      .sample {
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        border-top: 1px dashed #e2e8f0;
      }
      .sample .tile {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem;
        border-radius: 0.85rem;
        background: linear-gradient(160deg, #cfe8f8, #eef7fc);
      }
      .sample .icon {
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 4px 12px rgba(15, 39, 68, 0.1);
      }
      .sample h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
      }
      .sample p {
        margin: 0.1rem 0 0;
        font-size: 0.75rem;
        font-weight: 600;
        color: #64748b;
      }
      .feel {
        margin: 0.65rem 0 0;
        font-size: 0.78rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Test Generator — font pair options</h1>
    <p class="lead">
      Har card = Display (headings) + UI (body). Abhi active pair pehle card pe
      marked hai. Jo pasand aaye number bata dena.
    </p>
    <div class="grid" id="grid"></div>
    <script>
      const options = [
        {
          id: 1,
          name: "Current",
          display: "Fraunces",
          ui: "Sora",
          feel: "Editorial serif + clean geometric UI — soft paper / exam desk vibe.",
          current: true,
        },
        {
          id: 2,
          name: "Modern product",
          display: "Outfit",
          ui: "Source Sans 3",
          feel: "Friendly rounded headlines, very readable body — SaaS dashboard feel.",
        },
        {
          id: 3,
          name: "Sharp tech",
          display: "Space Grotesk",
          ui: "Inter",
          feel: "Tight, modern, technical — more startup / tooling than school desk.",
        },
        {
          id: 4,
          name: "Warm school",
          display: "Literata",
          ui: "DM Sans",
          feel: "Bookish serif + soft sans — textbook / board-exam paper mood.",
        },
        {
          id: 5,
          name: "Premium calm",
          display: "Instrument Serif",
          ui: "Manrope",
          feel: "Elegant thin serif titles + rounded UI — quiet, premium branding.",
        },
        {
          id: 6,
          name: "Clean academic",
          display: "Plus Jakarta Sans",
          ui: "IBM Plex Sans",
          feel: "All-sans, professional, dense UI friendly — formal academy admin.",
        },
      ];

      const grid = document.getElementById("grid");
      for (const o of options) {
        const card = document.createElement("article");
        card.className = "card" + (o.current ? " current" : "");
        card.innerHTML = `
          ${o.current ? '<span class="tag">Now in use</span>' : `<span class="tag">Option ${o.id}</span>`}
          <p class="pair">${o.name} · ${o.display} + ${o.ui}</p>
          <p class="display" style="font-family:'${o.display}', Georgia, serif">PaperForge</p>
          <p class="ui" style="font-family:'${o.ui}', system-ui, sans-serif">
            Test Generator · Generate Paper · Saved Papers · Account Settings
          </p>
          <div class="sample">
            <div class="tile">
              <div class="icon"></div>
              <div>
                <h3 style="font-family:'${o.display}', Georgia, serif">Generate Paper</h3>
                <p style="font-family:'${o.ui}', system-ui, sans-serif">Method 1</p>
              </div>
            </div>
          </div>
          <p class="feel">${o.feel}</p>
        `;
        grid.appendChild(card);
      }
    </script>
  </body>
</html>
